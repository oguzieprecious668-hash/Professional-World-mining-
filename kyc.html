<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KYC | ProfessionalMining</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark">P</div>
        <div>
          <span>ProfessionalMining</span>
          <small>Digital asset platform</small>
        </div>
      </a>

      <nav class="main-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="wallets.html">Wallets</a>
        <a href="transactions.html">Transactions</a>
        <a href="kyc.html" class="active">KYC</a>
      </nav>

      <div class="nav-actions">
        <a class="btn btn-secondary" href="login.html">Logout</a>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <div class="container">
      <div class="page-header">
        <div class="eyebrow">Verification center</div>
        <h1>Identity verification</h1>
      </div>

      <div class="panel large-panel">
        <form id="kycForm" class="auth-form">
          <div class="form-grid">
            <div class="field">
              <label>Full name</label>
              <input type="text" id="kycName" required />
            </div>

            <div class="field">
              <label>Date of birth</label>
              <input type="date" id="kycDob" required />
            </div>

            <div class="field">
              <label>Nationality</label>
              <input type="text" id="kycNationality" required />
            </div>

            <div class="field">
              <label>Phone number</label>
              <input type="tel" id="kycPhone" required />
            </div>

            <div class="field full-span">
              <label>Address</label>
              <input type="text" id="kycAddress" required />
            </div>

            <div class="field full-span">
              <label>ID document upload</label>
              <input type="file" id="kycFile" />
            </div>
          </div>

          <button class="btn btn-primary" type="submit">Submit KYC</button>
        </form>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
